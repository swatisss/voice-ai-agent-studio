# Spec: /process/sdd-workflow.md (Guardrails, layer 2)
# Make the jobs below *required* in branch protection so they cannot be skipped locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: Specs are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the spec-first/log/lifecycle rules diff against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Spec checks (pull request: whole-PR rules)"
        if: github.event_name == 'pull_request'
        env:
          SPEC_EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'no-spec') }}
        run: python scripts/spec_check.py --ci --base "origin/${{ github.base_ref }}"
      - name: Spec checks (push to main)
        if: github.event_name == 'push'
        run: python scripts/spec_check.py --ci
      - name: Architecture checks
        run: python scripts/arch_check.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
