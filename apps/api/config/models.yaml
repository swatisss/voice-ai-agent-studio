# LLM roles -> provider:model refs, fallbacks and prices.
# Spec: /architecture/llm-gateway.md  (model IDs live here only - never in code)
providers:
  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
    stream_usage: false        # Groq reports usage in x_groq on the last chunk
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
    stream_usage: true
    headers:
      HTTP-Referer: "https://github.com/voice-agent-studio"
      X-Title: "Voice Agent Studio"
  openai:
    base_url: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY
    stream_usage: true

models:   # price per 1M tokens (USD)
  "groq:openai/gpt-oss-120b":       { input: 0.15, output: 0.60, json_schema: true,  reasoning_effort: true }
  "groq:openai/gpt-oss-20b":        { input: 0.10, output: 0.50, json_schema: true,  reasoning_effort: true }
  "openrouter:openai/gpt-oss-120b": { input: 0.15, output: 0.60, json_schema: false, reasoning_effort: true }
  "openrouter:openai/gpt-oss-20b":  { input: 0.10, output: 0.50, json_schema: false, reasoning_effort: true }
  # Non-reasoning OpenAI chat models only (they take max_tokens and temperature). Confirm IDs and prices in the OpenAI console.
  "openai:gpt-4.1-mini":            { input: 0.40, output: 1.60, json_schema: true }
  "openai:gpt-4.1-nano":            { input: 0.10, output: 0.40, json_schema: true }
  # Speech-to-speech model for the realtime voice pipeline (role `speech`, /architecture/realtime-voice.md).
  # The ID is Pipecat 1.12's default Realtime model; prices are text and audio tokens per 1M and MUST be confirmed
  # in the OpenAI console (spike S4 could not reach the console).
  "openai:gpt-realtime-2.1":        { kind: speech, input: 4.00, output: 16.00, audio_input: 32.00, audio_output: 64.00 }

roles:
  realtime:
    model: "groq:openai/gpt-oss-120b"
    params: { reasoning_effort: low, temperature: 0.3, max_tokens: 800 }
    fallback: ["openrouter:openai/gpt-oss-120b", "openai:gpt-4.1-mini"]
  analysis:
    model: "groq:openai/gpt-oss-120b"
    params: { reasoning_effort: low, temperature: 0 }
    fallback: ["openrouter:openai/gpt-oss-120b", "openai:gpt-4.1-mini"]
  drafting:
    model: "groq:openai/gpt-oss-120b"
    params: { reasoning_effort: medium, temperature: 0.4 }
    fallback: ["openrouter:openai/gpt-oss-120b", "openai:gpt-4.1-mini"]
  simulator:
    model: "groq:openai/gpt-oss-20b"
    params: { reasoning_effort: low, temperature: 0.7, max_tokens: 400 }
    fallback: ["groq:openai/gpt-oss-120b", "openai:gpt-4.1-nano"]
  judge:
    model: "groq:openai/gpt-oss-120b"
    params: { reasoning_effort: low, temperature: 0 }
    fallback: ["openrouter:openai/gpt-oss-120b", "openai:gpt-4.1-mini"]
  turn:
    model: "groq:openai/gpt-oss-20b"
    params: { reasoning_effort: low, temperature: 0, max_tokens: 200 }
    fallback: ["openrouter:openai/gpt-oss-20b", "openai:gpt-4.1-nano"]
  speech:
    model: "openai:gpt-realtime-2.1"
    voices: [marin, cedar, coral, alloy, ash, ballad, echo, sage, shimmer, verse]   # first is the default; confirm in the console
    params: { transcription_model: "gpt-realtime-whisper" }
    fallback: []
