# LLM roles -> provider:model refs, fallbacks and prices.
# Spec: /architecture/llm-gateway.md  (model IDs live here only - never in code)
providers:
  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: GROQ_API_KEY
    stream_usage: false        # Groq reports usage in x_groq on the last chunk
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
    stream_usage: true
    headers:
      HTTP-Referer: "https://github.com/voice-agent-studio"
      X-Title: "Voice Agent Studio"

models:   # price per 1M tokens (USD)
  "groq:openai/gpt-oss-120b":       { input: 0.15, output: 0.60, json_schema: true,  reasoning_effort: true }
  "groq:openai/gpt-oss-20b":        { input: 0.10, output: 0.50, json_schema: true,  reasoning_effort: true }
  "openrouter:openai/gpt-oss-120b": { input: 0.15, output: 0.60, json_schema: false, reasoning_effort: true }
  "openrouter:openai/gpt-oss-20b":  { input: 0.10, output: 0.50, json_schema: false, reasoning_effort: true }

roles:
  realtime:
    model: "groq:openai/gpt-oss-120b"
    params: { reasoning_effort: low, temperature: 0.3, max_tokens: 800 }
    fallback: ["openrouter:openai/gpt-oss-120b"]
  analysis:
    model: "groq:openai/gpt-oss-120b"
    params: { reasoning_effort: low, temperature: 0 }
    fallback: ["openrouter:openai/gpt-oss-120b"]
  drafting:
    model: "groq:openai/gpt-oss-120b"
    params: { reasoning_effort: medium, temperature: 0.4 }
    fallback: ["openrouter:openai/gpt-oss-120b"]
  simulator:
    model: "groq:openai/gpt-oss-20b"
    params: { reasoning_effort: low, temperature: 0.7, max_tokens: 400 }
    fallback: ["groq:openai/gpt-oss-120b"]
  judge:
    model: "groq:openai/gpt-oss-120b"
    params: { reasoning_effort: low, temperature: 0 }
    fallback: ["openrouter:openai/gpt-oss-120b"]
